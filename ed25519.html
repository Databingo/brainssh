<body>

<div class="container">
  <h2>🧠 脑口令离线派生</h2>

  <div class="input-group">

    <button class="toggle-btn" id="toggleBtn" onclick="toggleMask()">隐藏</button>
  </div>
  <div class="counter" id="charCount">长度: 0 字符</div>

  <div class="btn-row">

    <button class="danger" onclick="wipeAll()">清空销毁</button>

    <div class="output-box" id="fp" style="color: #4ade80;"></div>

    <div style="margin-top: 12px;"></div>
    <div class="label-row"><span class="label">公钥 (id_ed25519.pub)</span><button class="copy-btn" onclick="copyText('pub')">一键复制</button></div>

    <div class="output-box" id="pri"></div>
  </div>
</div>

             336415420, 715569704, 821419934, 1110165055, 1432857476, 1794101826, 2125543780, 2400929283,
             2685282091, 3020679087, 3358059727, 3819641327, 4152829282, 31404270, 263085459, 405971428,
             595267419, 792911305, 1157609537, 1373581273, 1696185663, 1800377482, 2149449113, 2435685275,
             2753584868, 2974977469, 3180429492, 3451063839, 3623040104, 3971252908, 4194098855, 22654903,
             633967597, 720454583, 883451979, 1127051511, 1210505923, 1476571827, 1616616298, 1814674564,
             1998404005, 2118249754, 2432163669, 2466948901, 2697987864, 3071950044, 3277944730, 3624381080];

            var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
            var temp1 = (hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + w[i]) | 0;
            var temp2 = ((rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj) | 0;
            hash = [(temp1 + temp2) | 0].concat(hash);

        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    var res = new Uint8Array(32);
    for (i = 0; i < 8; i++) {
        res[i*4]   = (hash[i] >>> 24) & 255;
        res[i*4+1] = (hash[i] >>> 16) & 255;
        res[i*4+2] = (hash[i] >>> 8) & 255;
        res[i*4+3] = hash[i] & 255;
    }

}

// ==========================================
// 3. OpenSSH 格式封包与交互处理
// ==========================================
const phraseInput = document.getElementById('phrase');
let isMasked = false;

phraseInput.addEventListener('input', () => {
  const len = phraseInput.value.length;
  document.getElementById('charCount').innerText = `长度: ${len} 字符 ${len >= 32 ? '✅' : '(建议≥32)'}`;
});

function toggleMask() {
  isMasked = !isMasked;
  phraseInput.style.webkitTextSecurity = isMasked ? 'disc' : 'none';
  document.getElementById('toggleBtn').innerText = isMasked ? '显示' : '隐藏';
}

function wipeAll() {
  phraseInput.value = '';
  document.getElementById('charCount').innerText = '长度: 0 字符';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('pub').innerText = '';
  document.getElementById('pri').innerText = '';
  document.getElementById('fp').innerText = '';
}

const u32 = n => [n >> 24 & 255, n >> 16 & 255, n >> 8 & 255, n & 255];
const str = s => {
  var b=[]; for(var i=0;i<s.length;i++) b.push(s.charCodeAt(i)&255);
  return [...u32(b.length), ...b];
};
const bytes = b => [...u32(b.length), ...b];
const b64 = b => {
  var binary = ''; var len = b.length;
  for (var i = 0; i < len; i++) binary += String.fromCharCode(b[i]);
  return btoa(binary);
};

function doGenerate() {
  try {
    const text = phraseInput.value.trim();
    if (!text) {
      alert("请输入你的随机词串！");
      return;
    }

    // 1. 纯本地 SHA-256 算 Seed
    const seed = sha256(text);

    // 2. 纯本地 TweetNaCl 算 Ed25519 公私钥 (100% 吻合 Go 语言 NewKeyFromSeed)
    const keyPair = nacl.signKeypairFromSeed(seed);
    const pubRaw = keyPair.publicKey;
    const privKeyContent = keyPair.secretKey; // 64 字节 (32 字节 seed + 32 字节 pubKey)

    // 3. 封装标准 OpenSSH 公钥
    const pubBlob = [...str("ssh-ed25519"), ...bytes(pubRaw)];
    const pubB64 = b64(pubBlob);
    document.getElementById('pub').innerText = `ssh-ed25519 ${pubB64} brain-key`;

    // 4. 计算指纹
    const fpBytes = sha256(String.fromCharCode.apply(null, pubBlob));
    const fpB64 = b64(fpBytes).replace(/=+$/, '');
    document.getElementById('fp').innerText = `SHA256:${fpB64}`;

    // 5. 封装标准 OpenSSH 私钥
    const magic = [];
    var mStr = "openssh-key-v1\0";
    for(var i=0; i<mStr.length; i++) magic.push(mStr.charCodeAt(i));
    const check = [0x12, 0x34, 0x56, 0x78];

    let privBlock = [
      ...check, ...check,
      ...str("ssh-ed25519"),
      ...bytes(pubRaw),
      ...bytes(privKeyContent),
      ...str("")
    ];
    let pad = 1;
    while (privBlock.length % 8 !== 0) privBlock.push(pad++);

    const finalOpenSSH = [
      ...magic,
      ...str("none"), ...str("none"), ...str(""),
      ...u32(1),
      ...bytes(pubBlob),
      ...bytes(privBlock)
    ];

    const b64Priv = b64(finalOpenSSH).match(/.{1,64}/g).join('\n');
    document.getElementById('pri').innerText = `-----BEGIN OPENSSH PRIVATE KEY-----\n${b64Priv}\n-----END OPENSSH PRIVATE KEY-----`;

    document.getElementById('resultCard').style.display = 'block';
  } catch (err) {
    alert("生成出错: " + err.message);
  }
}

function copyText(id) {
  const text = document.getElementById(id).innerText;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板！')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert('已复制到剪贴板！');
}
</script>
